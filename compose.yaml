services:
  caddy:
    image: caddy:2

    ports:
      - "${PORT:-4242}:80"

    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile

  chat:
    image: ghcr.io/adrianliechti/wingman-chat

    environment:
      - WINGMAN_URL=http://platform:8080
      - CHAT_MODEL=qwen3.5
      - CHAT_INSTRUCTIONS=You are Wingman, a helpful assistant.
      - CHAT_COMPACTION_ENABLED=true
      - VISION_ENABLED=true
      - EXTRACTOR_ENABLED=true
      - INTERNET_ENABLED=true
      - INTERNET_SCRAPER=web
      - INTERNET_SEARCHER=web
      - INTERNET_RESEARCHER=web
      - TRANSLATOR_ENABLED=true
      - TRANSLATOR_MODEL=default
      - ARTIFACTS_ENABLED=true
      - REPOSITORY_ENABLED=true
      - REPOSITORY_EMBEDDER=qwen3-embedding
      - MEMORY_ENABLED=true

  platform:
    image: ghcr.io/adrianliechti/wingman-platform

    models:
      - llm
      - embedding

    configs:
      - source: platform
        target: /config.yaml

models:
  llm:
    model: ai/qwen3.5:4b
    context_size: 32768

  embedding:
    model: ai/qwen3-embedding:0.6b

configs:
  caddyfile:
    content: |
      {
        auto_https off
      }

      :80 {
        handle /v1/* {
          reverse_proxy http://platform:8080
        }

        handle {
          reverse_proxy http://chat:8000
        }
      }

  platform:
    content: |
      providers:
        - type: openai-compatible
          url: $${LLM_URL}

          models:
            qwen3.5:
              id: $${LLM_MODEL}

        - type: openai-compatible
          url: $${EMBEDDING_URL}

          models:
            qwen3-embedding:
              id: $${EMBEDDING_MODEL}

      scrapers:
        web:
          type: fetch

      searchers:
        web:
          type: duckduckgo

      researchers:
        web:
          type: agent
          model: qwen3.5
          scraper: web
          searcher: web

      extractors:
        default:
          type: default

      segmenters:
        default:
          type: text

      translators:
        default:
          type: llm
          model: qwen3.5
